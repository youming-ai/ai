# Deploys `main` to Cloudflare with Void. Replaces Cloudflare Workers Builds:
# disconnect that in the dashboard once this has deployed, or both will deploy.
#
# `void deploy` builds, applies pending D1 migrations (after saving a Time
# Travel restore point) and uploads, then verifies the new version before it
# takes traffic. It needs Node >= 24.21; Bun only installs and runs the checks.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, and never cancel one that has started applying
# migrations.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx vitest run
      # Typecheck and the byte budgets; `void deploy` rebuilds, but skips both.
      - run: bun run build
      - run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
