# Example: copy to wrangler.toml and fill ids
# See README.md Quick start
# Astro SSR on Workers: an AI-hardware desk with a D1-backed feed and a KV SWR
# cache in front of it. The cron pulls the desk's RSS sources into D1 and then
# curates the new rows with an OpenAI-compatible model; `/media/*` is relayed by
# the entrypoint before Astro sees the request.
name = "umuo"
compatibility_date = "2026-07-17"
compatibility_flags = ["nodejs_compat"]
main = "./worker/entrypoint.ts"

# Any OpenAI-compatible /chat/completions endpoint. LLM_API_KEY is a secret
# (`wrangler secret put LLM_API_KEY`), never a var, so it stays out of git.
[vars]
LLM_BASE_URL = "https://api.b.ai/v1"
LLM_MODEL = "mimo-v2.6-flash"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

[assets]
directory = "./dist"
binding = "ASSETS"

[[kv_namespaces]]
binding = "CACHE"
id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"  # TODO: wrangler kv namespace create CACHE

[[d1_databases]]
binding = "DB"
database_name = "umuo-content"
# Required for remote deploys — database_name alone does not resolve.
# Primary region is APAC; D1 cannot be moved without recreating it.
database_id = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"  # TODO: wrangler d1 create news-desk-content
migrations_dir = "migrations"

# No durable_objects/migrations here on purpose. A pending DO migration cannot
# be applied by `wrangler versions upload`, which is what Workers Builds runs
# for preview branches — so a Durable Object here breaks every PR build.
#
# Two schedules, told apart by controller.cron in worker/entrypoint.ts:
# */15 ingests, 17 3 sweeps. The daily string is duplicated in PRUNE_CRON
# (src/feeds/retention.ts) because the Worker cannot read this file at
# runtime; retention.cron.test.ts asserts the two stay identical.
[triggers]
crons = ["*/15 * * * *", "17 3 * * *"]
